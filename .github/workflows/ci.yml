name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build · E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager를 따름
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:fsd
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # 앱과 Storybook(dist/storybook)을 함께 빌드
      - run: pnpm build:all
      # 프로덕션 빌드를 띄워 접근성(axe)·화면 폭별 넘침·키보드 그리기·글꼴 파일 내보내기·스토리를 검사
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
